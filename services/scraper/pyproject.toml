[project]
name = "sindestiva-scraper"
version = "0.1.0"
description = "Worker de scraping (TPA/OGMO + EscalaNet) — Python fora do Turborepo"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Paulo Siqueira", email = "paulo@pscode.ia.br" },
]
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.49.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "apscheduler>=3.11.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "respx>=0.22.0",
    "mypy>=1.13.0",
]

[project.scripts]
sindestiva-scraper = "sindestiva_scraper.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sindestiva_scraper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "PT", "RET", "SIM", "ARG", "PTH", "TRY"]
ignore = ["TRY003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
