# =============================================================================
# SINDESTIVA-PE · Alembic config
# =============================================================================
# Convenções:
#   - `script_location` aponta para `alembic/` (env.py + versions/)
#   - `sqlalchemy.url` é OVERRIDDEN em `env.py` via `settings.database_url_sync`
#     (NÃO comitar credenciais aqui)
#   - Forward-only por convenção do projeto (Paulo) — não escrevemos
#     `downgrade()`. Downgrade = migration reversa explícita.
# =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = America/Recife
truncate_slug_length = 40
revision_environment = false
sourceless = false
version_path_separator = os
output_encoding = utf-8

# A URL é setada em env.py via `app.core.config.settings.database_url_sync`
sqlalchemy.url = postgresql://sindestiva:sindestiva@127.0.0.1:5433/sindestiva

[post_write_hooks]
# (vazio) — Paulo prefere revisão manual de cada migration antes de aplicar

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
