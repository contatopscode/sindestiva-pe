[project]
name = "sindestiva-api"
version = "0.1.0"
description = "API FastAPI do SINDESTIVA-PE (Lousa Digital)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Paulo Siqueira", email = "paulo@pscode.ia.br" },
]
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.4",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    "resend>=2.13.0",
    "weasyprint>=64.0",
    "playwright>=1.49.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.19.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "types-passlib>=1.7.7.20240819",
    "httpx>=0.28.1",
    "respx>=0.22.0",
]

[project.scripts]
sindestiva-api = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ",
    "EM", "EXE", "FA", "ISC", "ICN", "LOG", "PIE", "PT", "Q",
    "RET", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PL",
    "TRY", "FLY", "NPY", "PERF", "RUF",
]
ignore = [
    "TRY003",  # mensagens de exception longas são OK neste domínio
    "PLR0913", # DI com muitos parâmetros
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ARG", "FBT"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
