name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Frontend / PWA — lint + typecheck + test
  # ---------------------------------------------------------------------------
  web:
    name: Web / PWA (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # ---------------------------------------------------------------------
      # Barreira de regressão: impede que o fallback NXDOMAIN
      # 'https://api.lousa.pscode.ia.br' seja reintroduzido em
      # apps/web/src fora da lista branca documentada abaixo.
      # (SINDESTIVA-PE-FSW-2026-001 · S3 · F2 — C3 da SPEC §4.)
      #
      # Lista branca — cada entrada documentada (evitar lista silenciosa):
      #   1. api\.ts:.*DEFAULT_API_URL
      #      → apps/web/src/lib/api.ts — origem canônica da constante de
      #        dev de API_URL (única ocorrência de runtime permitida).
      #   2. api\.ts:.*scoped
      #      → apps/web/src/lib/api.ts (~linha 42) — comentário sobre o
      #        scoping do cookie httpOnly entre web.lousa.pscode.ia.br e
      #        api.lousa.pscode.ia.br (contexto arquitetural).
      #   3. __sindestiva/\[...path\]/route\.ts:
      #      → handler catch-all do proxy BFF — comentários de cabeçalho
      #        (linhas 2 e 6) e origin default `web.lousa.pscode.ia.br`
      #        (linha ~62). É o ÚNICO arquivo server-side que pode falar
      #        de api.lousa, porque é ele que faz o repasse upstream.
      #   4. api/auth/login/route\.ts:.*Domain=\.pscode\.ia\.br
      #      → apps/web/src/app/api/auth/login/route.ts (~linha 25) —
      #        comentário explicando o `Domain=.pscode.ia.br` do cookie
      #        httpOnly (compartilhamento entre web.lousa e api.lousa).
      #   5. centro-comando/page\.tsx:.*server-side
      #      → apps/web/src/app/centro-comando/page.tsx — usa API_URL
      #        direto em server-side rendering do componente de servidor
      #        (legítimo; proxy BFF só atende client-side).
      # ---------------------------------------------------------------------
      - name: Verify no NXDOMAIN fallback drift (C3)
        run: |
          set -e
          HITS=$(grep -rnE 'lousa\.pscode\.ia\.br' apps/web/src \
            | grep -vE '(api\.ts:.*DEFAULT_API_URL|api\.ts:.*scoped|__sindestiva/\[...path\]/route\.ts:|api/auth/login/route\.ts:.*Domain=\.pscode\.ia\.br|centro-comando/page\.tsx:.*server-side)' \
            || true)
          if [ -n "$HITS" ]; then
            echo "::error::NXDOMAIN fallback drift detectado em apps/web/src:"
            echo "$HITS"
            echo "Veja SPEC SINDESTIVA-PE-FSW-2026-001 §4 C3 — só as entradas na lista branca podem conter 'lousa.pscode.ia.br'."
            exit 1
          fi
          echo "OK — nenhuma ocorrência fora da lista branca."

  # ---------------------------------------------------------------------------
  # Backend / Scraper — ruff + pytest
  # ---------------------------------------------------------------------------
  api:
    name: API / Scraper (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ../../.python-version

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: pytest -q --maxfail=1

  scraper:
    name: Scraper worker (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/scraper
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ../../.python-version

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Smoke import
        run: python -c "import sindestiva_scraper; print('ok')"
